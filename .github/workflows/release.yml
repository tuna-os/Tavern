name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate release contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: python3 tools/validate-release.py --tag "${GITHUB_REF_NAME}"
      - name: Require a tag from main history
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  build-macos:
    name: macOS app bundle
    needs: validate
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: |
          brew update
          brew install gtk4 libadwaita blueprint-compiler meson ninja pkg-config desktop-file-utils
      - name: Build app bundle
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          ./run.sh --cask
      - name: Create normalized archive
        run: |
          find Tavern.app -exec touch -t 198001010000 {} +
          COPYFILE_DISABLE=1 zip -X -r Tavern-macOS.zip Tavern.app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: Tavern-macOS.zip
          if-no-files-found: error

  build-appimage:
    name: Linux AppImage
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson ninja-build pkg-config gettext desktop-file-utils \
            blueprint-compiler python3 python3-gi python3-requests python3-markdown \
            libgtk-4-dev libadwaita-1-dev libgirepository1.0-dev gobject-introspection \
            libfuse2 curl
      - name: Build and stage AppDir
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          meson setup builddir-appimage --prefix=/usr
          meson compile -C builddir-appimage
          DESTDIR="$PWD/AppDir" meson install -C builddir-appimage
      - name: Fetch verified packaging tools
        run: |
          curl --fail --location --retry 3 -o linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          echo 'c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  linuxdeploy-x86_64.AppImage' | sha256sum --check

          curl --fail --location --retry 3 -o linuxdeploy-plugin-gtk.sh \
            https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/7a3fbc31a9e5075073ff8790f26effbac5f84453/linuxdeploy-plugin-gtk.sh
          echo 'b0f4cbc684a0103a9651f0955b635eaea0096b3a66c0f5a2c2aa337960375171  linuxdeploy-plugin-gtk.sh' | sha256sum --check
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-gtk.sh
      - name: Build AppImage
        env:
          ARCH: x86_64
          LDAI_OUTPUT: Tavern-Linux.AppImage
          LDAI_UPDATE_INFORMATION: gh-releases-zsync|tuna-os|Tavern|latest|Tavern-Linux.AppImage.zsync
          DEPLOY_GTK_VERSION: 4
        run: |
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --plugin gtk \
            --desktop-file AppDir/usr/share/applications/org.tunaos.tavern.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/scalable/apps/org.tunaos.tavern.svg \
            --output appimage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-appimage
          path: Tavern-Linux.AppImage
          if-no-files-found: error

  build-flatpak:
    name: Flatpak bundle
    needs: validate
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          bundle: Tavern-Linux.flatpak
          manifest-path: org.tunaos.tavern.json
          cache-key: flatpak-builder-${{ github.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-flatpak
          path: Tavern-Linux.flatpak
          if-no-files-found: error

  publish:
    name: Attest and publish release
    needs: [build-macos, build-appimage, build-flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/Tavern.spdx.json
          upload-artifact: false
      - name: Generate checksums
        working-directory: dist
        run: sha256sum Tavern-Linux.AppImage Tavern-Linux.flatpak Tavern-macOS.zip Tavern.spdx.json > SHA256SUMS
      - name: Generate signed provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Generate signed SBOM attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
          sbom-path: dist/Tavern.spdx.json
      - name: Publish one release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
      - name: Dispatch Homebrew publishing from this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run update-homebrew-tap.yml --ref main -f release_tag="$GITHUB_REF_NAME"

  parity:
    name: Verify release parity
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Wait for all channels and verify parity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          echo "Verifying $TAG reached every channel (GitHub Release, AppImage, Flatpak, macOS, Homebrew cask, Flatpak OCI)."
          out=""
          for attempt in $(seq 1 60); do
            if out="$(python3 tools/check-release-parity.py --tag "$TAG" 2>&1)"; then
              echo "$out"
              echo "Release parity verified for $TAG: every channel carries it."
              exit 0
            fi
            echo "Attempt $attempt/60: parity not yet complete (Homebrew cask and Flatpak OCI publish async). Retrying in 20s."
            echo "$out" | sed 's/^/  /'
            sleep 20
          done
          echo "Release parity check timed out waiting for all channels." >&2
          echo "$out" | sed 's/^/  /' >&2
          exit 1
