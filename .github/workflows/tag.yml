name: Prepare Release Tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version already committed to Meson and AppStream (for example 0.2.0)
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  tag:
    name: Validate and tag main
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Validate release metadata
        run: python3 tools/validate-release.py --version "$RELEASE_VERSION"

      - name: Refuse an existing tag
        run: |
          if git rev-parse "v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "::error::v$RELEASE_VERSION already exists"
            exit 1
          fi

      - name: Create release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$RELEASE_VERSION" -m "Tavern $RELEASE_VERSION"
          git push origin "v$RELEASE_VERSION"

      - name: Dispatch release for the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref "v$RELEASE_VERSION"
