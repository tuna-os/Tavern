name: Prepare Release Tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version already committed to Meson and AppStream (for example 0.2.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  tag:
    name: Validate and tag main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Validate release metadata
        run: python3 tools/validate-release.py --version "${{ inputs.version }}"

      - name: Refuse an existing tag
        run: |
          if git rev-parse "v${{ inputs.version }}" >/dev/null 2>&1; then
            echo "::error::v${{ inputs.version }} already exists"
            exit 1
          fi

      - name: Create release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ inputs.version }}" -m "Tavern ${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"
