name: Build and Publish Flatpak OCI

# Build/publish body lives in tuna-os/.github's reusable publish-flatpak.yml
# (tunaos#1183 recommendation #2). This file just keeps this branch's own
# trigger policy -- promote-to-prod.yml on main fast-forwards this branch
# and explicitly dispatches this workflow (a bot push alone doesn't
# re-trigger the push event), so both triggers stay.

on:
  push:
    branches:
      - prod
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  publish:
    uses: tuna-os/.github/.github/workflows/publish-flatpak.yml@7c0708158bc2dae611750fceed2c98d2ca7f52f4 # main
    with:
      app-id: org.tunaos.tavern
      manifest-path: org.tunaos.tavern.json
      repo-name: tuna-os/tavern
      archs: '["x86_64"]'
    secrets: inherit
