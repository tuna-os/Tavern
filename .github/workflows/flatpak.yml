name: Flatpak CI

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  flatpak:
    name: "Flatpak Build"
    runs-on: ubuntu-latest
    # --privileged is required by flatpak-github-actions itself (bubblewrap
    # needs it to create sandboxes inside the container; documented as the
    # standard usage in every example in flatpak/flatpak-github-actions'
    # own README, no narrower alternative offered) — tuna-os/letters#16.
    # This job only builds a CI artifact (no publish/release step), so it
    # needs nothing beyond read access; making that floor explicit here
    # instead of relying on the repo's default token permissions setting.
    permissions:
      contents: read
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged

    steps:
    - uses: actions/checkout@v7.0.1

    - uses: flatpak/flatpak-github-actions/flatpak-builder@v6.8
      with:
        bundle: Tavern-Linux-CI.flatpak
        manifest-path: org.tunaos.tavern.json
        cache-key: flatpak-builder-${{ github.sha }}

    - name: Upload Flatpak Artifact
      uses: actions/upload-artifact@v7.0.1
      with:
        name: Tavern-Linux-CI
        path: Tavern-Linux-CI.flatpak
