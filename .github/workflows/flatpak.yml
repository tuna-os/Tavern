name: Flatpak CI

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  flatpak:
    name: "Flatpak Build"
    runs-on: ubuntu-latest
    # --privileged is required by flatpak-github-actions itself (bubblewrap
    # needs it to create sandboxes inside the container; documented as the
    # standard usage in every example in flatpak/flatpak-github-actions'
    # own README, no narrower alternative offered) — tuna-os/letters#16.
    # This job only builds a CI artifact (no publish/release step), so it
    # needs nothing beyond read access; making that floor explicit here
    # instead of relying on the repo's default token permissions setting.
    permissions:
      contents: read
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    # flatpak-builder updates the runtimes baked into the image. Some
    # runner hosts' overlayfs cannot rename image-layer directories, and
    # that update fails with "Invalid cross-device link". The action
    # copies the installation up only on those hosts (tuna-os/.github#380).
    - name: Make the image's Flatpak installations updatable
      uses: tuna-os/.github/.github/actions/flatpak-copy-up@main

    - uses: flatpak/flatpak-github-actions/flatpak-builder@v6.8
      with:
        bundle: Tavern-Linux-CI.flatpak
        manifest-path: org.tunaos.tavern.json
        cache-key: flatpak-builder-${{ github.sha }}

    - name: Upload Flatpak Artifact
      uses: actions/upload-artifact@v7.0.2
      with:
        name: Tavern-Linux-CI
        path: Tavern-Linux-CI.flatpak
