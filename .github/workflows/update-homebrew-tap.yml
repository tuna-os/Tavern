name: Update Homebrew Tap

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release tag to process (for example v0.2.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: update-homebrew-tap
  cancel-in-progress: false

jobs:
  update-tap:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Require the org tap credential
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          test -n "$TAP_TOKEN" || { echo '::error::TAP_GITHUB_TOKEN must have write access to tuna-os/homebrew-tap'; exit 1; }

      - name: Checkout the maintained cask
        uses: actions/checkout@v7.0.1
        with:
          repository: tuna-os/homebrew-tap
          ref: main
          path: tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}

      - name: Download published artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          gh release download "$RELEASE_TAG" --repo tuna-os/Tavern --dir artifacts \
            --pattern Tavern-macOS.zip --pattern Tavern-Linux.AppImage --pattern SHA256SUMS
          cd artifacts
          sha256sum --check --ignore-missing SHA256SUMS

      - name: Update only version and platform checksums
        run: |
          python3 tools/update-homebrew-cask.py tap/Casks/tavern.rb \
            --version "${RELEASE_TAG#v}" \
            --macos artifacts/Tavern-macOS.zip --linux artifacts/Tavern-Linux.AppImage
          ruby -c tap/Casks/tavern.rb

      - name: Commit and push cask update
        working-directory: tap
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks/tavern.rb
          if ! git diff --cached --quiet; then
            git commit -m "Update Tavern cask to $RELEASE_TAG"
            git push origin HEAD:main
          fi
